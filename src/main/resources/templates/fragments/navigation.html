<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
</head>
<body>

<header th:fragment="navigation">
    <nav class="main-nav">
        <ul>
            <li th:if="${@userHelperService.isAuthenticated()}">
                <a href="/">Home</a>
            </li>
            <th:block th:unless="${@userHelperService.isAuthenticated()}">
                <li>
                    <a th:href="@{/users/login}">Login</a>
                </li>
                <li>
                    <a th:href="@{/users/register}">Register</a>
                </li>
                <li>
                    <a th:href="@{/about}">About</a>
                </li>
            </th:block>

            <th:block th:if="${@userHelperService.isAuthenticated()}">
                <li>
                    <a th:href="@{/routes/add}">Add new route</a>
                </li>
                <li>
                    <a th:href="@{/users/profile}">Profile</a>
                </li>
                <li th:if="${@userHelperService.hasRole('ADMIN')}">
                    <a href="/">Admin</a>
                </li>
                <li>
                    <form th:action="@{users/logout}" method="POST">
                        <input type="submit" value="Logout" class="logout-btn" />
                    </form>
                </li>
            </th:block>

<!--            <li>-->
<!--                <th:block th:text="${@loggedUser.username} == null ? 'no user' : ${@loggedUser.username}"></th:block>-->
<!--            </li>-->
        </ul>
    </nav>
</header>

</body>
</html>
